{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gapless.fullname" . }}-dashboard
  labels:
    {{- include "gapless.labels" (dict "root" $ "component" "monitoring") | nindent 4 }}
    # The Grafana sidecar loads every ConfigMap with this label, in every namespace.
    grafana_dashboard: '1'
data:
  gapless.json: |-
    {{- .Files.Get "dashboards/gapless.json" | nindent 4 }}
{{- end }}
