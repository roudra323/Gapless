apiVersion: v1
kind: Service
metadata:
  name: {{ include "gapless.fullname" . }}-api
  labels:
    {{- include "gapless.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  # Only ready API Pods get traffic: the readiness probe controls this list.
  selector:
    {{- include "gapless.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    # The public API. The HTTPRoute (step 4c) sends /v1 here.
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    # /metrics for Prometheus. The Gateway never routes it (docs/02 "Ports").
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
