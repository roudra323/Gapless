# Dev-only chain for the kind cluster: anvil from the official Foundry image, the same as
# docker-compose.yml. Never part of the app chart. The chain lives in memory: a Pod restart starts
# a new, empty chain (redeploy MockToken and reset the database).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil
  namespace: gapless
  labels:
    app.kubernetes.io/name: anvil
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil
    spec:
      securityContext:
        runAsNonRoot: true
        # The image's user is the name "foundry"; Kubernetes can prove "non-root" only from a number.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:v1.8.6@sha256:4a16a86f41d30418fbdca47ce2868121bbb0aeaa0a34bde2dd1e2911c4be2464
          # The image's entrypoint is `/bin/sh -c`, so the whole command is one argument.
          args: ['anvil --host 0.0.0.0 --chain-id 31337']
          ports:
            - name: rpc
              containerPort: 8545
          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# NodePort 30545, mapped to localhost:18545 on the Mac (kind-config.yaml), so forge can deploy
# MockToken from the Mac. Inside the cluster the app uses http://anvil:8545.
apiVersion: v1
kind: Service
metadata:
  name: anvil
  namespace: gapless
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: anvil
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
      nodePort: 30545
