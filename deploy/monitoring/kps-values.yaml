# kube-prometheus-stack on kind (`make kind-up`). The chart version is pinned in the Makefile.
# Only the settings we change are here; everything else is the chart default.

# kind runs etcd, the scheduler, the controller manager and kube-proxy with their metrics bound
# to 127.0.0.1, so Prometheus cannot reach them. Scraping them would only fire TargetDown.
# EKS hides these components too.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    # A kind node is a container with no NTP status (node_timex_sync_status is always 0); the
    # Docker VM keeps its clock. On kind this warning would fire all the time. EKS nodes run
    # chrony, so keep it there.
    NodeClockNotSynchronising: true

prometheus:
  prometheusSpec:
    # By default Prometheus reads only the ServiceMonitors and rules that carry this release's
    # label. A missing label is a silent failure: no scrape, no alert, no error. Select every
    # object in every namespace instead, so the app chart needs no special label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # A dev cluster: keep two days of data, in the Pod (emptyDir), not on a volume.
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

grafana:
  # No admin password in the repo: the Grafana chart generates a random one into the Secret
  # kube-prometheus-stack-grafana (read it with the command in docs/07).
  defaultDashboardsTimezone: utc
  sidecar:
    dashboards:
      # Load every ConfigMap with grafana_dashboard: "1", from every namespace (the app chart's
      # dashboard lives in the app namespace).
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: ALL
