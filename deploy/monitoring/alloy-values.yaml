# Grafana Alloy on kind (`make kind-up`): ships Pod logs to Loki. The chart version is pinned in the
# Makefile. Only the settings we change are here; everything else is the chart default.
#
# One Alloy Pod per node (DaemonSet, the chart default). Each one reads the logs of the Pods on its
# own node through the Kubernetes API (loki.source.kubernetes), so it needs no hostPath mount and no
# root, and no log line is read twice.

alloy:
  configMap:
    content: |
      // The Pods on this node only (NODE_NAME comes from the downward API, below).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Loki labels from Kubernetes metadata only (docs/09 "Logs"). Never a log field such as
      // reqId or an address: each label value makes a new stream. Query JSON fields with `| json`.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app_kubernetes_io_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "app_kubernetes_io_component"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  # No usage statistics sent to Grafana Labs.
  enableReporting: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Least privilege: the chart's default ClusterRole also reads Secrets, ConfigMaps and the Prometheus
# Operator objects. Log collection through the API needs only Pods, their logs and namespaces. The
# chart joins both lists into one ClusterRole and renders a broken file if one of them is empty.
rbac:
  rules:
    - apiGroups: ['']
      resources: [pods, pods/log]
      verbs: [get, list, watch]
  clusterRules:
    - apiGroups: ['']
      resources: [namespaces]
      verbs: [get, list, watch]
