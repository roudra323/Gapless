name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # The indexer tests deploy MockToken from its forge build artifact (docs/06).
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - run: forge soldeer install && forge build
        working-directory: contracts
      # Testcontainers uses the runner's Docker daemon for Postgres and anvil.
      - run: pnpm test:integration

  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # The chaos tests deploy MockToken from its forge build artifact (docs/06).
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - run: forge soldeer install && forge build
        working-directory: contracts
      # Builds the indexer (some tests run dist/main.js as a child process), then runs the tests.
      - run: pnpm test:chaos

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Path filter inside the job (not on the workflow), so the job always reports
      # a status and branch protection can require it.
      - id: changes
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git diff --quiet "$BASE" HEAD -- contracts/ .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - if: steps.changes.outputs.run == 'true'
        run: forge soldeer install
      - if: steps.changes.outputs.run == 'true'
        run: forge fmt --check
      - if: steps.changes.outputs.run == 'true'
        run: forge build
      - if: steps.changes.outputs.run == 'true'
        run: forge test

  # Builds both images (no push; ECR comes in Phase 9) and checks them (docs/07 "Docker").
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [indexer, api]
    env:
      IMAGE: gapless-${{ matrix.app }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One cache scope per app, so the two builds don't evict each other's layers.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # Compressed size, measured the same way on every image store (`docker image inspect` reports
      # the uncompressed size on the classic store).
      - name: Size budget (200 MB compressed)
        run: |
          size=$(docker save "$IMAGE" | gzip -c | wc -c)
          echo "$IMAGE: $((size / 1000000)) MB compressed (budget 200 MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 200000000
      # Proves the image starts and the code loads: with no config it must log the fatal
      # "invalid configuration" line and exit 1, on a read-only root filesystem like the pods.
      - name: Starts and rejects an empty config
        run: |
          set +e
          out=$(docker run --rm --read-only --cap-drop ALL "$IMAGE" 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          grep -q '"msg":"invalid configuration"' <<<"$out"

  # Lints the Helm chart, checks the rendered manifests with kubeconform, and unit-tests the alert
  # rules with promtool (docs/08). The same Makefile targets as on a laptop.
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      # No maintained setup action for kubeconform: download the release and check its SHA-256
      # (from the release's CHECKSUMS file).
      - name: Install kubeconform v0.8.0
        env:
          URL: https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make chart-lint
      # promtool from the pinned Prometheus image (the runner has Docker).
      - run: make rules-test

  # Terraform (docs/08, adr/0004): fmt, validate and tflint, then apply and destroy envs/dev
  # against the local Floci emulator, which starts real k3s and Postgres containers on the
  # runner. No AWS credentials in this job.
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Path filter inside the job (not on the workflow), so the job always reports
      # a status and branch protection can require it.
      - id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git diff --quiet "$BASE" HEAD -- infra/ Makefile .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          # The wrapper adds outputs to every terraform call; the Makefile needs the plain binary.
          terraform_wrapper: false
      - if: steps.changes.outputs.run == 'true'
        # The token only raises GitHub's rate limit for tflint's plugin download.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make tf-check
      - if: steps.changes.outputs.run == 'true'
        run: make floci-apply
      - if: steps.changes.outputs.run == 'true'
        run: make floci-destroy
      - if: always() && steps.changes.outputs.run == 'true'
        run: make floci-down
